<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mayank Tyagi — QA Engineer | Professional Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --primary: #1a9b8e;
    --primary-dark: #0d7a72;
    --primary-light: #2db8a8;
    --primary-lighter: #5fcdba;
    --secondary: #ff6b35;
    --text-dark: #0f0f0f;
    --text-light: #666666;
    --text-lighter: #999999;
    --bg-white: #ffffff;
    --bg-light: #f5f7fa;
    --border-color: #e0e0e0;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--text-dark);
    background: linear-gradient(180deg, rgba(13,122,114,0.03) 0%, #f7faf9 45%, #ffffff 100%);
    line-height: 1.6;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%;
    right: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(13, 122, 114, 0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: -1;
    animation: floatBg 20s ease-in-out infinite;
  }

  @keyframes floatBg {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(30px, 30px); }
  }

  /* Background rotation keyframes (applied to .hero-photo::before when enabled) */
  @keyframes rotate-bg {
    0%   { transform: rotate(-6deg); }
    25%  { transform: rotate(6deg); }
    50%  { transform: rotate(-6deg); }
    75%  { transform: rotate(6deg); }
    100% { transform: rotate(-6deg); }
  }

  /* Apply background rotation only to the wrapper when 'rotating-bg' class is present */
  .hero-photo.rotating-bg::before {
    animation: rotate-bg 8s ease-in-out infinite;
    transform-origin: 50% 50%;
  }

  @media (prefers-reduced-motion: reduce) {
    .hero-photo.rotating-bg::before { animation: none; }
  }

  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(224, 224, 224, 0.5);
    z-index: 1000;
    padding: 0 40px;
    height: 70px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
  }

  .nav-logo {
    font-size: 26px;
    font-weight: 900;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-decoration: none;
    animation: slideDown 0.6s ease-out;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 56px;
    min-height: 56px;
  }

  .nav-logo.circular {
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(26,155,142,0.15), rgba(26,155,142,0.05));
    -webkit-text-fill-color: transparent;
    text-decoration: none;
    padding: 0 14px;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .nav-links {
    display: flex;
    gap: 40px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: var(--text-dark);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 1px;
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-transform: uppercase;
    position: relative;
  }

  .nav-links a::after {
    content: '';
    position: absolute;
    bottom: -5px;
    left: 0;
    width: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    border-radius: 2px;
  }

  .nav-links a:hover {
    color: var(--primary);
    transform: translateY(-2px);
  }

  .nav-links a:hover::after {
    width: 100%;
  }

  .hero {
    padding-top: 120px;
    padding-bottom: 100px;
    padding-left: 40px;
    padding-right: 40px;
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 80px;
    align-items: center;
    max-width: 1500px;
    margin: 0 auto;
  }

  .hero-content h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 50px;
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 25px;
    color: var(--text-dark);
    letter-spacing: -2px;
    animation: fadeInUp 0.8s ease-out 0.2s both;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hero-title {
    font-size: 18px;
    color: var(--primary);
    font-weight: 800;
    margin-bottom: 25px;
    text-transform: uppercase;
    letter-spacing: 2px;
    animation: fadeInUp 0.8s ease-out 0.1s both;
  }

  .hero-subtitle {
    font-size: 17px;
    color: var(--text-light);
    margin-bottom: 40px;
    line-height: 1.9;
    max-width: 600px;
    animation: fadeInUp 0.8s ease-out 0.3s both;
  }

  .hero-photo {
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    animation: fadeInUp 0.8s ease-out 0.4s both;
  }

  .hero-photo::before {
    content: '';
    position: absolute;
    width: 380px;
    height: 380px;
    background: linear-gradient(135deg, var(--primary-light), var(--primary-lighter));
    border-radius: 30px;
    opacity: 0.3;
    z-index: -1;
    /* background rotation controlled via .rotating-bg on parent */
  }

  @keyframes rotatePulse {
    0%, 100% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(10deg) scale(1.05); }
  }

  .hero-photo img {
    width: 100%;
    max-width: 360px;
    height: 360px;
    object-fit: cover;
    border-radius: 20px;
    box-shadow: 0 30px 80px rgba(26, 155, 142, 0.2);
    border: 8px solid white;
  }

  @keyframes floatImage {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
  }

  .cta-buttons {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 50px;
    animation: fadeInUp 0.8s ease-out 0.5s both;
  }

  .btn {
    padding: 15px 32px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    letter-spacing: 0.5px;
    position: relative;
    overflow: hidden;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.2);
    transition: left 0.5s ease;
    z-index: 0;
  }

  .btn:hover::before { left: 100%; }
  .btn > * { position: relative; z-index: 1; }

  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    box-shadow: 0 10px 30px rgba(26, 155, 142, 0.2);
  }

  .btn-primary:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 50px rgba(26, 155, 142, 0.35);
  }

  .btn-secondary {
    background: white;
    color: var(--primary);
    border: 2.5px solid var(--primary);
    box-shadow: 0 10px 30px rgba(26, 155, 142, 0.1);
  }

  .btn-secondary:hover {
    background: var(--primary);
    color: white;
    transform: translateY(-4px);
    box-shadow: 0 20px 50px rgba(26, 155, 142, 0.25);
  }

  .btn-download {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
  }

  .btn-download:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 50px rgba(102, 126, 234, 0.35);
  }

  section {
    padding: 100px 35px;
    max-width: 1500px;
    margin: 0 auto;
    animation: fadeInUp 0.8s ease-out;
  }

  section.light-bg {
    background: linear-gradient(180deg, rgba(26, 155, 142, 0.02) 0%, transparent 100%);
  }

  section h2 {
    font-family: 'Poppins', sans-serif;
    font-size: 48px;
    font-weight: 900;
    margin-bottom: 25px;
    letter-spacing: -1px;
    background: linear-gradient(135deg, var(--text-dark), var(--text-light));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .section-subtitle {
    font-size: 17px;
    color: var(--text-light);
    margin-bottom: 55px;
    max-width: 800px;
    line-height: 1.8;
  }

  /* Add responsive + modal styles for certificates */
  .cert-card { cursor: pointer; }

  @media (max-width: 640px) {
    .certs-grid { grid-template-columns: 1fr !important; gap: 20px; padding: 0 12px; }
    .cert-card { max-width: 100%; width: 100%; align-self: stretch; border-radius: 12px; }
    .cert-image-wrapper { min-height: 200px; aspect-ratio: auto; }
    .cert-info { padding: 16px; }
  }

  /* Fullscreen modal */
  .cert-modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); z-index: 2000; padding: 20px; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .cert-modal.open { display: flex; }
  .cert-modal .modal-inner { position: relative; max-width: 100%; max-height: 100%; width: 100%; display:flex; align-items:center; justify-content:center; }
  .cert-modal img { max-width: 100%; max-height: calc(100vh - 80px); border-radius: 8px; object-fit: contain; box-shadow: 0 20px 80px rgba(0,0,0,0.6); }
  .cert-modal .cert-close { position: absolute; top: 14px; right: 14px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.95); border: none; font-size: 22px; line-height:1; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; z-index:2010; box-shadow: 0 6px 18px rgba(0,0,0,0.3); }
  @media (max-width:420px) { .cert-modal .cert-close { width:40px; height:40px; font-size:20px; } }

</style>
</head>
<body>

<!-- NOTE: original content preserved. Certificates section should already exist in the page and use .certs-grid and .cert-card classes. -->

<!-- Add modal markup dynamically via JS. JS will create the modal at runtime. -->

<!-- Rest of your HTML content (unchanged) -->

<script>
// Certificate modal script
(function(){
  document.addEventListener('DOMContentLoaded', function () {
    // create modal
    var modal = document.createElement('div');
    modal.id = 'cert-modal';
    modal.className = 'cert-modal';
    modal.innerHTML = '\n      <div class="modal-inner" role="dialog" aria-modal="true">\n        <button class="cert-close" aria-label="Close certificate">&times;</button>\n        <img id="cert-modal-img" src="" alt="Certificate full view">\n      </div>';
    document.body.appendChild(modal);

    var modalImg = document.getElementById('cert-modal-img');
    var closeBtn = modal.querySelector('.cert-close');

    // delegate click: open when a .cert-card is clicked
    document.body.addEventListener('click', function (e) {
      var card = e.target.closest('.cert-card');
      if (!card) return;
      var fullSrc = card.getAttribute('data-full-src') || (card.querySelector('img') && card.querySelector('img').src);
      if (!fullSrc) return;
      modalImg.src = fullSrc;
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    });

    function closeModal() {
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      modalImg.src = '';
    }

    closeBtn.addEventListener('click', function (e) { e.stopPropagation(); closeModal(); });

    modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });

    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });
  });
})();
</script>

</body>
</html>
